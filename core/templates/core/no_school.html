{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No school access · SchoolOS</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="grid min-h-screen place-items-center bg-paper px-5">
  <div class="card max-w-lg p-8 text-center">
    <span class="mx-auto grid size-12 place-items-center rounded-full bg-amber-100 text-amber-800">
      <svg aria-hidden="true" class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    </span>
    <h1 class="mt-5 text-2xl font-bold text-ink">No active school access</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">Your account is valid, but it has no active school membership. A school head must assign access.</p>
    <form method="post" action="{% url 'logout' %}" class="mt-6">
      {% csrf_token %}
      <button class="btn-secondary" type="submit">Sign out</button>
    </form>
  </div>
</body>
</html>

{% if form.non_field_errors %}
  <div class="alert alert-error mb-5">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
<div class="space-y-5">
  {% for field in form %}
    {% include "core/partials/form_field.html" with field=field %}
  {% endfor %}
</div>
